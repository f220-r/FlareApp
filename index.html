<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlareApp — Clinician Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Smooth transitions and scrollbar */
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-800">

  <!-- TOP NAVIGATION -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-teal-500 flex items-center justify-center shadow-md shadow-indigo-200 text-white">
          <i data-lucide="activity" class="w-6 h-6 animate-pulse"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="font-extrabold text-xl tracking-tight text-slate-900">
              Flare<span class="text-indigo-600">App</span>
            </span>
            <span class="bg-indigo-50 text-indigo-700 text-[11px] font-bold px-2 py-0.5 rounded-full border border-indigo-200">
              CLINICIAN CDSS
            </span>
          </div>
          <p class="text-xs text-slate-500 font-medium tracking-wide">Monitorea. Registra. Anticipa.</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="hidden md:flex items-center flex-1 max-w-md mx-8 relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="Search patient by Name or DNI..."
          class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
          oninput="handleSearch(this.value)"
        />
      </div>

      <!-- Right Header Actions -->
      <div class="flex items-center space-x-4">
        <!-- Notification Bell -->
        <div class="relative">
          <button
            onclick="toggleNotifications()"
            class="relative p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 transition"
            title="Alerts"
          >
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center ring-2 ring-white">0</span>
          </button>

          <!-- Notification Dropdown -->
          <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 p-3 z-50">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 px-2">
              <div class="flex items-center space-x-2">
                <i data-lucide="shield-alert" class="w-4 h-4 text-rose-600"></i>
                <h4 class="font-bold text-sm text-slate-900">High-Risk Exacerbation Alerts</h4>
              </div>
            </div>
            <div id="notifList" class="max-h-80 overflow-y-auto divide-y divide-slate-100 py-1"></div>
          </div>
        </div>

        <!-- Clinician Profile -->
        <div class="flex items-center space-x-3 pl-3 border-l border-slate-200">
          <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-sm">ET</div>
          <div class="hidden lg:block text-left">
            <div id="clinicianName" class="text-xs font-bold text-slate-900 leading-tight">Dr. Elena Torres</div>
            <div id="clinicianCenter" class="text-[11px] text-slate-500 leading-tight">CAP Primary Care</div>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- PATIENT SELECTOR STRIP -->
  <section class="bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-2.5">
    <div class="max-w-[1720px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">
        <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
        <span>Select Patient File:</span>
      </div>
      <div id="patientSelectorList" class="flex flex-wrap items-center gap-2"></div>
    </div>
  </section>

  <!-- MAIN VIEWPORT -->
  <main id="mainContainer" class="flex-1 max-w-[1720px] w-full mx-auto p-4 sm:p-6 lg:p-8"></main>

  <!-- DETAIL MODAL -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[92vh] overflow-y-auto">
      <div class="p-5 sm:p-6 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white">
            <i data-lucide="microscope" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-lg text-slate-900">Telemetry & Optical Sputum Inspection</h3>
            <p id="modalSubhead" class="text-xs text-slate-500"></p>
          </div>
        </div>
        <button onclick="closeModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modalBody" class="p-5 sm:p-6 space-y-6"></div>
      <div class="p-4 sm:p-5 bg-slate-50 border-t border-slate-100 rounded-b-3xl flex justify-between items-center">
        <span class="text-[11px] text-slate-500 font-medium">Physical button-press authenticated log</span>
        <button onclick="closeModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition">Close Inspection</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    let appData = null;
    let selectedPatientId = 'PAT-4029';
    let searchQuery = '';
    let notifsOpen = false;

    // Load data from JSON
    async function loadData() {
      try {
        const response = await fetch('./data.json');
        appData = await response.json();
      } catch (err) {
        console.error("Could not load data.json:", err);
      }
      renderApp();
    }

    function getSputumMeta(score) {
      if (score >= 4.0) return { hex: '#3E5C38', label: 'Purulent (Bacterial High)', bg: 'bg-rose-50 text-rose-800 border-rose-300' };
      if (score >= 3.0) return { hex: '#8C9640', label: 'Mucopurulent (Alert)', bg: 'bg-amber-50 text-amber-800 border-amber-300' };
      if (score >= 2.0) return { hex: '#D1CA6A', label: 'Slightly Mucopurulent', bg: 'bg-yellow-50 text-yellow-800 border-yellow-200' };
      return { hex: '#E5EDDC', label: 'Mucoid (Normal Baseline)', bg: 'bg-emerald-50 text-emerald-800 border-emerald-200' };
    }

    function renderApp() {
      if (!appData) return;

      // Render Clinician Profile & Notifications
      document.getElementById('clinicianName').innerText = appData.clinician.name;
      document.getElementById('clinicianCenter').innerText = appData.clinician.center;

      const unreadNotifs = appData.notifications.filter(n => n.unread);
      const badge = document.getElementById('notifBadge');
      if (unreadNotifs.length > 0) {
        badge.innerText = unreadNotifs.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      document.getElementById('notifList').innerHTML = appData.notifications.map(n => `
        <div onclick="selectPatient('${n.patientId}'); toggleNotifications();" class="p-3 rounded-xl cursor-pointer hover:bg-slate-50 transition">
          <div class="flex justify-between text-xs font-bold text-slate-900 mb-1">
            <span>${n.patientName}</span>
            <span class="text-[10px] text-slate-400 font-normal">${n.time}</span>
          </div>
          <p class="text-xs font-semibold text-rose-600">${n.title}</p>
          <p class="text-[11px] text-slate-500 mt-1">${n.message}</p>
        </div>
      `).join('');

      // Render Patient Selector Pills
      const filtered = appData.patients.filter(p => 
        p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        p.dni.toLowerCase().includes(searchQuery.toLowerCase())
      );

      document.getElementById('patientSelectorList').innerHTML = filtered.map(p => {
        const isSel = p.id === selectedPatientId;
        return `
          <button onclick="selectPatient('${p.id}')" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition border ${
            isSel ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm shadow-indigo-200' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
          }">
            <span>${p.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded ${isSel ? 'bg-indigo-700 text-indigo-100' : 'bg-slate-200 text-slate-600'}">
              ${p.assignedToMe ? 'Assigned' : 'Unassigned'}
            </span>
          </button>
        `;
      }).join('');

      // Render Main Content
      const patient = appData.patients.find(p => p.id === selectedPatientId) || appData.patients[0];
      const main = document.getElementById('mainContainer');

      if (!patient.assignedToMe) {
        // Restricted Access View
        main.innerHTML = `
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-12 text-center max-w-xl mx-auto my-12">
            <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-700 mx-auto flex items-center justify-center mb-6">
              <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-2">Access Restricted: External Care Team</h2>
            <p class="text-sm text-slate-600 mb-6">Patient <strong class="text-slate-900">${patient.name}</strong> (DNI: ${patient.dni}) is assigned to another care team. Medical telemetry and optical records are restricted.</p>
            <button onclick="selectPatient('PAT-4029')" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition">
              Return to Assigned Patient (Mateo Fontdevila)
            </button>
          </div>
        `;
      } else {
        // Split-Screen Dashboard
        main.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- LEFT PANEL: PROFILE & BASELINE -->
            <aside class="lg:col-span-4 space-y-6">
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                <span class="text-[11px] font-mono text-indigo-600 font-bold">${patient.id} • DNI: ${patient.dni}</span>
                <h2 class="text-xl font-extrabold text-slate-900 mt-0.5">${patient.name}</h2>
                <p class="text-xs text-slate-500 mt-1">${patient.age} yo • ${patient.sex} • ${patient.smokingStatus}</p>

                <!-- AI Exacerbation Predictor -->
                <div class="mt-5 p-4 rounded-xl bg-gradient-to-br from-slate-900 to-indigo-950 text-white">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="text-[11px] font-semibold text-indigo-300 uppercase tracking-wider">AI Flare-Up Predictor (24-48h)</div>
                      <div class="text-3xl font-black mt-1">${patient.exacerbationRiskScore}<span class="text-sm font-normal text-slate-400">/100</span></div>
                    </div>
                    <span class="px-2.5 py-1 text-xs font-bold rounded-lg ${patient.exacerbationRiskScore > 75 ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'}">
                      ${patient.exacerbationRiskScore > 75 ? 'CRITICAL IMMINENT' : 'ELEVATED WATCH'}
                    </span>
                  </div>
                  <div class="w-full bg-slate-800 rounded-full h-2 mt-3 overflow-hidden">
                    <div class="h-full ${patient.exacerbationRiskScore > 75 ? 'bg-rose-500' : 'bg-amber-400'}" style="width: ${patient.exacerbationRiskScore}%"></div>
                  </div>
                </div>

                <!-- COPD Baseline Metrics -->
                <div class="grid grid-cols-2 gap-3 mt-4 text-xs">
                  <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="text-slate-400 font-medium">FEV1 % Predicted</span>
                    <p class="text-base font-bold text-slate-800 mt-0.5">${patient.fev1Predicted}%</p>
                  </div>
                  <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="text-slate-400 font-medium">GOLD Stage</span>
                    <p class="text-base font-bold text-slate-800 mt-0.5">${patient.goldStage.split(' ')[0]} ${patient.goldStage.split(' ')[1]}</p>
                  </div>
                  <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="text-slate-400 font-medium">BMI</span>
                    <p class="text-base font-bold text-slate-800 mt-0.5">${patient.bmi} kg/m²</p>
                  </div>
                  <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="text-slate-400 font-medium">Hospitalizations (Yr)</span>
                    <p class="text-base font-bold text-rose-600 mt-0.5">${patient.hospitalizationsLastYear} Admissions</p>
                  </div>
                </div>
              </div>

              <!-- Delta Context & Regimen -->
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Clinical Baseline Delta Context</h3>
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="text-slate-600 font-medium">Baseline Sputum Color:</span>
                    <span class="font-bold text-slate-900 flex items-center">
                      <span class="w-3 h-3 rounded-full mr-1.5 border border-slate-300" style="background-color: ${getSputumMeta(patient.baselineSputumScore).hex}"></span>
                      Score ${patient.baselineSputumScore.toFixed(1)} (Mucoid)
                    </span>
                  </div>
                </div>
                <div>
                  <div class="text-xs font-semibold text-slate-700 mb-2">Active Prescriptions</div>
                  <div class="space-y-1.5">
                    ${patient.currentMedications.map(m => `
                      <div class="text-xs p-2 rounded-lg bg-slate-50 border border-slate-100 flex justify-between">
                        <span class="font-bold text-slate-800">${m.name}</span>
                        <span class="font-mono text-indigo-600">${m.dose}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            </aside>

            <!-- RIGHT PANEL: CHARTS & LOGS -->
            <section class="lg:col-span-8 space-y-6">
              <!-- Charts Row -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Sputum Score SVG Trend -->
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                  <div class="flex justify-between items-center mb-2">
                    <div>
                      <h4 class="text-xs font-bold text-slate-900 uppercase">Sputum Purulence Trend</h4>
                      <p class="text-[11px] text-slate-500">CIE L*a*b* score (1.0 - 5.0)</p>
                    </div>
                    <span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">Δ +2.4 Shift</span>
                  </div>
                  <div class="h-28 w-full">
                    <svg class="w-full h-full" viewBox="0 0 200 80">
                      <rect x="0" y="0" width="200" height="26" fill="#FEE2E2" opacity="0.4" />
                      <rect x="0" y="26" width="200" height="26" fill="#FEF3C7" opacity="0.3" />
                      <rect x="0" y="52" width="200" height="28" fill="#ECFDF5" opacity="0.5" />
                      <line x1="0" y1="60" x2="200" y2="60" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />
                      <polyline fill="none" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" points="15,64 60,62 105,58 150,36 190,12" />
                      <circle cx="15" cy="64" r="3" fill="#10B981" />
                      <circle cx="60" cy="62" r="3" fill="#10B981" />
                      <circle cx="105" cy="58" r="3" fill="#F59E0B" />
                      <circle cx="150" cy="36" r="3.5" fill="#F43F5E" />
                      <circle cx="190" cy="12" r="4.5" fill="#BE123C" />
                    </svg>
                  </div>
                </div>

                <!-- Duration Bar Chart -->
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                  <div class="flex justify-between items-center mb-2">
                    <div>
                      <h4 class="text-xs font-bold text-slate-900 uppercase">Attack Hold Duration</h4>
                      <p class="text-[11px] text-slate-500">Phone button-press duration (sec)</p>
                    </div>
                  </div>
                  <div class="h-28 flex items-end justify-between px-4 pt-4">
                    <div class="flex flex-col items-center"><span class="text-[10px] text-slate-400">0s</span><div class="w-8 bg-indigo-300 rounded-t h-2"></div><span class="text-[10px] text-slate-500 mt-1">21st</span></div>
                    <div class="flex flex-col items-center"><span class="text-[10px] text-slate-400">45s</span><div class="w-8 bg-indigo-400 rounded-t h-8"></div><span class="text-[10px] text-slate-500 mt-1">22nd</span></div>
                    <div class="flex flex-col items-center"><span class="text-[10px] text-slate-400">0s</span><div class="w-8 bg-indigo-300 rounded-t h-2"></div><span class="text-[10px] text-slate-500 mt-1">23rd</span></div>
                    <div class="flex flex-col items-center"><span class="text-[10px] text-rose-600 font-bold">96s</span><div class="w-8 bg-amber-500 rounded-t h-16"></div><span class="text-[10px] text-slate-500 mt-1">24th</span></div>
                    <div class="flex flex-col items-center"><span class="text-[10px] text-rose-600 font-bold">142s</span><div class="w-8 bg-rose-600 rounded-t h-24"></div><span class="text-[10px] text-slate-500 mt-1">Today</span></div>
                  </div>
                </div>
              </div>

              <!-- TELEMETRY LOGS TABLE -->
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100">
                  <h3 class="font-extrabold text-base text-slate-900">Telemetry Stream & Symptom Logs</h3>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs text-slate-600">
                    <thead class="bg-slate-50 text-slate-400 uppercase font-bold text-[10px]">
                      <tr>
                        <th class="py-3 px-4">Date/Time</th>
                        <th class="py-3 px-4">Type</th>
                        <th class="py-3 px-4">Duration</th>
                        <th class="py-3 px-4">Dyspnea</th>
                        <th class="py-3 px-4">Inhalers</th>
                        <th class="py-3 px-4">Environment</th>
                        <th class="py-3 px-4">Sputum Score</th>
                        <th class="py-3 px-4 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${patient.logs.map(l => {
                        const meta = getSputumMeta(l.sputumScore);
                        return `
                          <tr onclick="openModal('${l.id}')" class="cursor-pointer hover:bg-slate-50 transition ${l.significantChange ? 'bg-amber-50/40 border-l-4 border-l-amber-500' : ''}">
                            <td class="py-3.5 px-4 font-semibold text-slate-800">${l.timestamp}</td>
                            <td class="py-3.5 px-4">${l.type === 'button_attack' ? '<span class="text-rose-600 font-bold">Button Attack</span>' : 'Daily Check'}</td>
                            <td class="py-3.5 px-4 font-mono font-bold">${l.durationSec > 0 ? l.durationSec + 's' : '—'}</td>
                            <td class="py-3.5 px-4 font-bold ${l.dyspnea >= 4 ? 'text-rose-600' : 'text-slate-800'}">${l.dyspnea}/5</td>
                            <td class="py-3.5 px-4 font-mono">${l.inhalerPuffs} puffs</td>
                            <td class="py-3.5 px-4 text-[11px]">AQI ${l.aqi} • ${l.tempC}°C • ${l.humidity}%</td>
                            <td class="py-3.5 px-4">
                              <span class="inline-flex items-center px-2 py-0.5 rounded border text-[11px] font-bold ${meta.bg}">
                                <span class="w-2.5 h-2.5 rounded-full mr-1.5" style="background-color: ${meta.hex}"></span>
                                ${l.sputumScore.toFixed(1)}
                              </span>
                            </td>
                            <td class="py-3.5 px-4 text-right">
                              <button class="px-2.5 py-1 text-xs font-bold text-indigo-600 bg-indigo-50 rounded-lg hover:bg-indigo-100">Inspect</button>
                            </td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      // Re-initialize Lucide Icons after DOM updates
      lucide.createIcons();
    }

    function selectPatient(id) {
      selectedPatientId = id;
      renderApp();
    }

    function handleSearch(q) {
      searchQuery = q;
      renderApp();
    }

    function toggleNotifications() {
      notifsOpen = !notifsOpen;
      document.getElementById('notifDropdown').classList.toggle('hidden', !notifsOpen);
    }

    function openModal(logId) {
      const patient = appData.patients.find(p => p.id === selectedPatientId);
      const log = patient.logs.find(l => l.id === logId);
      if (!log) return;

      const meta = getSputumMeta(log.sputumScore);

      document.getElementById('modalSubhead').innerText = `Recorded ${log.timestamp} • Patient: ${patient.name}`;
      document.getElementById('modalBody').innerHTML = `
        <div class="grid grid-cols-3 gap-3 text-xs">
          <div class="p-3 bg-slate-50 rounded-xl"><span class="text-slate-400">Duration</span><p class="font-bold text-slate-800 text-sm mt-0.5">${log.durationSec}s</p></div>
          <div class="p-3 bg-slate-50 rounded-xl"><span class="text-slate-400">Dyspnea</span><p class="font-bold text-rose-600 text-sm mt-0.5">${log.dyspnea}/5</p></div>
          <div class="p-3 bg-slate-50 rounded-xl"><span class="text-slate-400">Rescue Puffs</span><p class="font-bold text-slate-800 text-sm mt-0.5">${log.inhalerPuffs}</p></div>
        </div>

        <div class="p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-xs">
          <strong>Environmental Context:</strong> Air Quality AQI ${log.aqi} • Temp ${log.tempC}°C • Humidity ${log.humidity}%
        </div>

        <!-- Sputum Colorimetry -->
        <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200">
          <h4 class="font-extrabold text-sm text-slate-900 mb-4">CIE L*a*b* Optical Sputum Classification</h4>
          <div class="flex items-center space-x-6">
            <div class="w-28 h-28 rounded-full border-4 border-white shadow-xl flex items-center justify-center text-white font-mono font-bold text-sm shadow-inner" style="background-color: ${meta.hex}">
              Score ${log.sputumScore.toFixed(1)}
            </div>
            <div class="space-y-2 text-xs flex-1">
              <div class="p-2.5 bg-white rounded-xl border border-slate-200 font-mono flex justify-between">
                <span>L*: ${log.cieLab.L}</span>
                <span>a*: ${log.cieLab.a}</span>
                <span>b*: ${log.cieLab.b}</span>
              </div>
              <div class="p-2.5 bg-white rounded-xl border border-slate-200">
                <div class="flex justify-between font-bold mb-1">
                  <span>Bacterial Culture Positivity:</span>
                  <span class="text-rose-600">${log.bacterialCultureProbability}%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2">
                  <div class="h-full bg-rose-600 rounded-full" style="width: ${log.bacterialCultureProbability}%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="p-4 rounded-2xl ${log.sputumScore >= 3.5 ? 'bg-rose-50 border border-rose-200 text-rose-900' : 'bg-emerald-50 border border-emerald-200 text-emerald-900'}">
          <h5 class="font-bold text-xs uppercase">Recommended Clinical Action:</h5>
          <p class="text-xs font-semibold mt-1">${log.clinicalRecommendation}</p>
        </div>
      `;

      document.getElementById('detailModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    // Close modal on Escape
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Initial boot
    loadData();
  </script>
</body>
</html>
